name: Automatic PR code and specification review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: businessharness-automatic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'jihadkhawaja/BusinessHarness' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    steps:
      # Build only the workflow's trusted base revision. PR commits are fetched
      # as Git objects after the build; no PR files or submodules are checked out.
      - name: Check out trusted harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-harness
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Build trusted harness
        working-directory: trusted-harness
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          dotnet restore src/BusinessHarness.Cli/BusinessHarness.Cli.csproj --locked-mode --configfile NuGet.Config
          dotnet publish src/BusinessHarness.Cli/BusinessHarness.Cli.csproj -c Release --no-restore --output "$RUNNER_TEMP/businessharness-bin"

      - name: Fetch PR commits for diff inspection
        working-directory: trusted-harness
        shell: bash
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
          HARNESS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HARNESS_BASE" =~ ^[0-9a-f]{40}$ || ! "$HARNESS_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GitHub did not return valid commit IDs.' >&2
            exit 2
          fi
          git -c core.hooksPath=/dev/null fetch --no-tags origin "$HARNESS_BASE" "$HARNESS_HEAD"

      - name: Review PR changes and linked specifications
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
          HARNESS_HEAD: ${{ github.event.pull_request.head.sha }}
          HARNESS_PROVIDER: ${{ vars.HARNESS_PROVIDER || 'openai' }}
          HARNESS_MODEL: ${{ vars.HARNESS_MODEL }}
          HARNESS_JIRA_SITE: ${{ vars.HARNESS_JIRA_SITE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dotnet "$RUNNER_TEMP/businessharness-bin/BusinessHarness.Cli.dll" review \
            --repo "$GITHUB_WORKSPACE/trusted-harness" \
            --base "$HARNESS_BASE" --head "$HARNESS_HEAD" \
            --memory-scope off \
            --output "$RUNNER_TEMP/businessharness-results" --feedback none

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: businessharness-automatic-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/businessharness-results
          if-no-files-found: ignore
          retention-days: 7
