# Set HARNESS_IMAGE to your published image@sha256:digest, and HARNESS_MODEL in CI variables.
# Keep this job in a trusted pipeline definition; protected/masked API variables only.
# Configure GITLAB_TOKEN for MR metadata; use an eligible bot with api scope for optional feedback.
businessharness:
  image:
    name: $HARNESS_IMAGE
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  allow_failure: false
  script:
    - >-
      dotnet /app/BusinessHarness.Cli.dll review
      --repo "$CI_PROJECT_DIR"
      --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      --head "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      --output "$CI_PROJECT_DIR/harness-results"
  artifacts:
    when: always
    paths: [harness-results/]
    expire_in: 7 days
